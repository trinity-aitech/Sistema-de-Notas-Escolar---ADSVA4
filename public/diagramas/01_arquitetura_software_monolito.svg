<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <linearGradient id="gradHeader" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Fundo Principal -->
  <rect width="1200" height="800" fill="#0f172a"/>

  <!-- Título e Subtítulo -->
  <text x="50" y="45" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700">Diagrama de Arquitetura de Software - Monólito Modular em Java Puro</text>
  <text x="50" y="70" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14">Estrutura em camadas: Clientes HTTPS, Camada HTTP, Módulos de Domínio, JDBC e PostgreSQL / Supabase</text>

  <!-- 1. CAMADA DE CLIENTES (Atores Externos) -->
  <rect x="50" y="95" width="1100" height="105" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="70" y="122" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1">1. ATORES EXTERNOS (CLIENTES WEB - HTTPS)</text>
  
  <rect x="70" y="135" width="320" height="48" rx="8" fill="#2563eb" filter="url(#shadow)"/>
  <text x="230" y="165" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Professor (Lançamento e Diário)</text>

  <rect x="440" y="135" width="320" height="48" rx="8" fill="#16a34a" filter="url(#shadow)"/>
  <text x="600" y="165" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Aluno (Boletim e Frequência LDB)</text>

  <rect x="810" y="135" width="320" height="48" rx="8" fill="#d97706" filter="url(#shadow)"/>
  <text x="970" y="165" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Pais / Responsáveis (Alertas)</text>

  <!-- Conectores Clientes -> Backend -->
  <path d="M 230 183 L 230 225" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 600 183 L 600 225" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 970 183 L 970 225" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2. CAMADA HTTP & ROTEAMENTO (Backend Java) -->
  <rect x="50" y="230" width="1100" height="100" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="70" y="255" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1">2. CAMADA HTTP &amp; SERVIDOR (JAVA SE 21+ COM VIRTUAL THREADS)</text>

  <rect x="70" y="268" width="320" height="45" rx="8" fill="#475569"/>
  <text x="230" y="296" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">HttpServer Nativo &amp; Virtual Threads</text>

  <rect x="440" y="268" width="320" height="45" rx="8" fill="#475569"/>
  <text x="600" y="296" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Roteador REST &amp; CORS (/api/*)</text>

  <rect x="810" y="268" width="320" height="45" rx="8" fill="#475569"/>
  <text x="970" y="296" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">StaticFileHandler (Frontend Web)</text>

  <!-- Conectores HTTP -> Módulos -->
  <path d="M 600 330 L 600 365" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 3. MÓDULOS DE DOMÍNIO & REGRAS -->
  <rect x="50" y="370" width="1100" height="185" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="70" y="395" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1">3. MÓDULOS DE DOMÍNIO &amp; REGRAS DE NEGÓCIO</text>

  <!-- Mod Alunos -->
  <rect x="70" y="410" width="245" height="125" rx="8" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
  <rect x="70" y="410" width="245" height="28" rx="8" fill="#0284c7"/>
  <text x="192" y="429" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Módulo de Alunos e Turmas</text>
  <text x="85" y="460" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12">• Cadastro de Alunos</text>
  <text x="85" y="482" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12">• Séries, Turmas e Turnos</text>
  <text x="85" y="504" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12">• Gestão de Professores</text>

  <!-- Mod Notas -->
  <rect x="345" y="410" width="245" height="125" rx="8" fill="#0f172a" stroke="#16a34a" stroke-width="1.5"/>
  <rect x="345" y="410" width="245" height="28" rx="8" fill="#16a34a"/>
  <text x="467" y="429" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Módulo de Notas</text>
  <text x="360" y="460" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12">• Avaliações Bimestrais</text>
  <text x="360" y="482" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12">• Lançamento de Notas</text>
  <text x="360" y="504" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12">• Cálculo de Médias</text>

  <!-- Mod Presenca -->
  <rect x="620" y="410" width="245" height="125" rx="8" fill="#0f172a" stroke="#d97706" stroke-width="1.5"/>
  <rect x="620" y="410" width="245" height="28" rx="8" fill="#d97706"/>
  <text x="742" y="429" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Módulo de Presença</text>
  <text x="635" y="460" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12">• Diário de Classe Eletrônico</text>
  <text x="635" y="482" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12">• Registro de Presença/Falta</text>
  <text x="635" y="504" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12">• Apuração da Frequência (%)</text>

  <!-- Mod Regras -->
  <rect x="895" y="410" width="235" height="125" rx="8" fill="#0f172a" stroke="#dc2626" stroke-width="1.5"/>
  <rect x="895" y="410" width="235" height="28" rx="8" fill="#dc2626"/>
  <text x="1012" y="429" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Módulo de Regras</text>
  <text x="910" y="460" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12">• Art. 24 LDB: Freq &gt;= 75%</text>
  <text x="910" y="482" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12">• Normas do CEE</text>
  <text x="910" y="504" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12">• Resultados Finais</text>

  <!-- Conectores Módulos -> Persistência -->
  <path d="M 600 555 L 600 580" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 4. CAMADA DE PERSISTÊNCIA (JDBC PURO) -->
  <rect x="50" y="585" width="1100" height="80" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="70" y="608" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1">4. CAMADA DE ACESSO A DADOS (JDBC PURO)</text>

  <rect x="70" y="618" width="190" height="36" rx="6" fill="#334155"/>
  <text x="165" y="641" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">AlunoDAO</text>

  <rect x="290" y="618" width="190" height="36" rx="6" fill="#334155"/>
  <text x="385" y="641" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">TurmaDAO</text>

  <rect x="510" y="618" width="190" height="36" rx="6" fill="#334155"/>
  <text x="605" y="641" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">NotaDAO</text>

  <rect x="730" y="618" width="190" height="36" rx="6" fill="#334155"/>
  <text x="825" y="641" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">PresencaDAO</text>

  <rect x="950" y="618" width="180" height="36" rx="6" fill="#334155"/>
  <text x="1040" y="641" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">DatabaseConfig</text>

  <!-- Conectores Persistência -> Banco -->
  <path d="M 600 665 L 600 690" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 5. BANCO DE DADOS -->
  <rect x="50" y="695" width="1100" height="75" rx="12" fill="#1e293b" stroke="#2563eb" stroke-width="2"/>
  <rect x="350" y="710" width="500" height="45" rx="8" fill="#1d4ed8" filter="url(#shadow)"/>
  <text x="600" y="738" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Banco de Dados: PostgreSQL / Supabase</text>
</svg>
