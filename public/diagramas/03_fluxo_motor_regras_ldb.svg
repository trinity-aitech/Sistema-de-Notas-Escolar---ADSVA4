<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 820" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1250" height="820" fill="#0f172a"/>

  <!-- Título e Subtítulo -->
  <text x="50" y="45" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700">Fluxograma do Motor de Regras de Avaliação e Aprovação</text>
  <text x="50" y="70" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14">Base legal: Lei de Diretrizes e Bases da Educação Nacional (LDB 9.394/96, Art. 24) e Regimento Escolar</text>

  <!-- Início -->
  <g transform="translate(50, 110)" filter="url(#shadow)">
    <rect width="210" height="95" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="105" y="32" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">1. Dados de Entrada</text>
    <text x="105" y="55" fill="#cbd5e1" font-family="sans-serif" font-size="12" text-anchor="middle">Notas: N1, N2, N3, N4</text>
    <text x="105" y="75" fill="#cbd5e1" font-family="sans-serif" font-size="12" text-anchor="middle">Aulas Previstas e Faltas</text>
  </g>

  <!-- Seta 1 -->
  <line x1="260" y1="157" x2="310" y2="157" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Passo 1: Frequência -->
  <g transform="translate(320, 110)" filter="url(#shadow)">
    <rect width="250" height="95" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <text x="125" y="32" fill="#60a5fa" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">2. Cálculo de Frequência</text>
    <text x="125" y="55" fill="#e2e8f0" font-family="sans-serif" font-size="12" text-anchor="middle">Freq% = ((Aulas - Faltas) / Aulas) * 100</text>
    <text x="125" y="75" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Critério Federal LDB Art. 24</text>
  </g>

  <!-- Seta 2 -->
  <line x1="570" y1="157" x2="630" y2="157" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Decisão 1: Freq < 75% -->
  <g transform="translate(640, 95)" filter="url(#shadow)">
    <polygon points="120,0 240,62 120,124 0,62" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="120" y="55" fill="#fde047" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">Frequência</text>
    <text x="120" y="73" fill="#fde047" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">&lt; 75%?</text>
  </g>

  <!-- Seta Sim: Freq < 75% -->
  <line x1="880" y1="157" x2="960" y2="157" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="915" y="147" fill="#ef4444" font-family="sans-serif" font-size="12" font-weight="700">SIM</text>

  <!-- Resultado: Reprovado Falta -->
  <g transform="translate(970, 110)" filter="url(#shadow)">
    <rect width="240" height="95" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="2"/>
    <text x="120" y="35" fill="#fca5a5" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">REPROVADO POR FALTA</text>
    <text x="120" y="58" fill="#fecaca" font-family="sans-serif" font-size="12" text-anchor="middle">Status: REPROVADO_FREQ</text>
    <text x="120" y="78" fill="#f87171" font-family="sans-serif" font-size="11" text-anchor="middle">Vedado exame por lei federal</text>
  </g>

  <!-- Seta Não Freq: Vai para Média -->
  <line x1="760" y1="220" x2="760" y2="290" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="770" y="255" fill="#10b981" font-family="sans-serif" font-size="12" font-weight="700">NÃO (Freq ≥ 75%)</text>

  <!-- Passo 3: Cálculo da Média Anual -->
  <g transform="translate(635, 300)" filter="url(#shadow)">
    <rect width="250" height="85" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <text x="125" y="32" fill="#60a5fa" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">3. Média Anual (MA)</text>
    <text x="125" y="55" fill="#e2e8f0" font-family="sans-serif" font-size="13" text-anchor="middle">MA = (N1 + N2 + N3 + N4) / 4</text>
    <text x="125" y="73" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Escala padrão de 0.00 a 10.00</text>
  </g>

  <!-- Seta após Média para Decisão de Nota -->
  <line x1="760" y1="385" x2="760" y2="445" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Decisão de Média -->
  <g transform="translate(635, 455)" filter="url(#shadow)">
    <polygon points="125,0 250,55 125,110 0,55" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
    <text x="125" y="50" fill="#e9d5ff" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">Avaliação da</text>
    <text x="125" y="68" fill="#e9d5ff" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">Média Anual (MA)</text>
  </g>

  <!-- Ramo 1: MA >= 7.0 (Aprovado Direto) -->
  <line x1="635" y1="510" x2="350" y2="510" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="470" y="500" fill="#10b981" font-family="sans-serif" font-size="12" font-weight="700">MA ≥ 7.0 (Direto)</text>

  <g transform="translate(100, 465)" filter="url(#shadow)">
    <rect width="240" height="90" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
    <text x="120" y="33" fill="#6ee7b7" font-family="sans-serif" font-size="15" font-weight="700" text-anchor="middle">APROVADO DIRETO</text>
    <text x="120" y="55" fill="#a7f3d0" font-family="sans-serif" font-size="12" text-anchor="middle">Status: APROVADO</text>
    <text x="120" y="75" fill="#d1fae5" font-family="sans-serif" font-size="11" text-anchor="middle">Atingiu média regimental</text>
  </g>

  <!-- Ramo 2: MA < 4.0 (Reprovado Direto) -->
  <line x1="885" y1="510" x2="960" y2="510" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="895" y="500" fill="#ef4444" font-family="sans-serif" font-size="12" font-weight="700">MA &lt; 4.0</text>

  <g transform="translate(970, 465)" filter="url(#shadow)">
    <rect width="240" height="90" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="2"/>
    <text x="120" y="33" fill="#fca5a5" font-family="sans-serif" font-size="15" font-weight="700" text-anchor="middle">REPROVADO POR NOTA</text>
    <text x="120" y="55" fill="#fecaca" font-family="sans-serif" font-size="12" text-anchor="middle">Status: REPROVADO_NOTA</text>
    <text x="120" y="75" fill="#fca5a5" font-family="sans-serif" font-size="11" text-anchor="middle">Sem pontuação para exame</text>
  </g>

  <!-- Ramo 3: 4.0 <= MA < 7.0 (Recuperação Final) -->
  <line x1="760" y1="565" x2="760" y2="610" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="770" y="590" fill="#f59e0b" font-family="sans-serif" font-size="12" font-weight="700">4.0 ≤ MA &lt; 7.0 (Exame)</text>

  <!-- Bloco Exame Final -->
  <g transform="translate(635, 620)" filter="url(#shadow)">
    <rect width="250" height="85" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="125" y="28" fill="#fbbf24" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">4. Exame de Recuperação</text>
    <text x="125" y="50" fill="#e2e8f0" font-family="sans-serif" font-size="12" text-anchor="middle">Nota Exame (NE) realizada</text>
    <text x="125" y="70" fill="#cbd5e1" font-family="sans-serif" font-size="12" text-anchor="middle">Média Final = (MA + NE) / 2</text>
  </g>

  <!-- Decisão MF >= 5.0 -->
  <line x1="635" y1="662" x2="440" y2="662" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="490" y="652" fill="#10b981" font-family="sans-serif" font-size="12" font-weight="700">MF ≥ 5.0</text>

  <g transform="translate(190, 625)" filter="url(#shadow)">
    <rect width="240" height="75" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
    <text x="120" y="32" fill="#6ee7b7" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">APROVADO POR EXAME</text>
    <text x="120" y="55" fill="#a7f3d0" font-family="sans-serif" font-size="11" text-anchor="middle">Status: APROVADO_EXAME</text>
  </g>

  <!-- Reprovado no Exame -->
  <line x1="885" y1="662" x2="960" y2="662" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="895" y="652" fill="#ef4444" font-family="sans-serif" font-size="12" font-weight="700">MF &lt; 5.0</text>

  <g transform="translate(970, 625)" filter="url(#shadow)">
    <rect width="240" height="75" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="2"/>
    <text x="120" y="32" fill="#fca5a5" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">REPROVADO NO EXAME</text>
    <text x="120" y="55" fill="#fecaca" font-family="sans-serif" font-size="11" text-anchor="middle">Status: REPROVADO_EXAME</text>
  </g>

  <!-- Rodapé informativo -->
  <rect x="50" y="745" width="1150" height="45" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="70" y="773" fill="#94a3b8" font-family="sans-serif" font-size="12">Legenda de Cores: Verde = Aprovação Regimental | Vermelho = Reprovação (Falta ou Nota) | Amarelo = Análise / Exame | Azul = Processamento Algorítmico</text>
</svg>
