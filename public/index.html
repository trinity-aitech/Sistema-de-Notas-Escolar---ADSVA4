<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Notas Escolar - Acesso</title>
    <link rel="stylesheet" href="css/styles.css?v=3">
    <!-- Lucide Icons & SweetAlert2 -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="login-page">
    <header class="topbar">
        <div class="topbar-left">
            <a class="brand" href="/index.html">
                <span class="brand-mark"><i data-lucide="graduation-cap"></i></span>
                <span class="brand-name">Notas Escolar</span>
            </a>
        </div>
        <div class="topbar-right" style="margin-left: auto;">
            <a href="https://github.com/trinity-aitech/Sistema-de-Notas-Escolar---ADSVA4" target="_blank" class="icon-btn" title="Repositório GitHub">
                <i data-lucide="github"></i>
            </a>
        </div>
    </header>

    <div class="shell">
        <div class="login-card">
            <h2>Fazer login</h2>
            <p class="lead">Acesse o portal acadêmico com seu perfil institucional</p>

            <div class="role-cards">
                <button type="button" class="role-btn active" onclick="selectRole('PROFESSOR', event)">
                    <i data-lucide="award"></i>
                    <span class="role-name">Professor</span>
                </button>
                <button type="button" class="role-btn" onclick="selectRole('ALUNO', event)">
                    <i data-lucide="book-open"></i>
                    <span class="role-name">Aluno</span>
                </button>
                <button type="button" class="role-btn" onclick="selectRole('RESPONSAVEL', event)">
                    <i data-lucide="users"></i>
                    <span class="role-name">Responsável</span>
                </button>
            </div>

            <form id="loginForm" onsubmit="handleLoginSubmit(event)">
                <div class="form-group">
                    <label for="emailInput">E-mail institucional</label>
                    <input type="email" id="emailInput" required value="carlos.silva@escola.com" placeholder="nome@escola.com">
                </div>
                <div class="form-group">
                    <label for="senhaInput">Senha</label>
                    <input type="password" id="senhaInput" required value="123456" placeholder="••••••••">
                </div>
                <div style="display: flex; justify-content: flex-end; margin-top: 1.5rem;">
                    <button type="submit" class="btn btn-primary" style="padding: 0 1.5rem; height: 40px;">
                        <i data-lucide="log-in"></i>
                        Acessar o portal
                    </button>
                </div>
            </form>

            <div class="login-hint">
                <i data-lucide="info" style="width: 16px; height: 16px; flex-shrink: 0; color: var(--primary);"></i>
                <span>Clique em um dos perfis acima para alternar automaticamente as credenciais predefinidas.</span>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        const credentials = {
            PROFESSOR: { email: 'carlos.silva@escola.com', url: '/professor.html' },
            ALUNO: { email: 'lucas.mendes@escola.com', url: '/aluno.html' },
            RESPONSAVEL: { email: 'maria.mendes@email.com', url: '/responsavel.html' }
        };

        let currentRole = 'PROFESSOR';

        document.addEventListener('DOMContentLoaded', () => {
            if (window.lucide) {
                window.lucide.createIcons();
            }
        });

        function selectRole(role, evt) {
            currentRole = role;
            document.querySelectorAll('.role-btn').forEach(btn => btn.classList.remove('active'));
            if (evt && evt.currentTarget) {
                evt.currentTarget.classList.add('active');
            }
            document.getElementById('emailInput').value = credentials[role].email;
        }

        async function handleLoginSubmit(e) {
            e.preventDefault();
            const email = document.getElementById('emailInput').value;
            const senha = document.getElementById('senhaInput').value;

            try {
                const user = await window.schoolApi.login(email, senha);
                window.schoolApi.setCurrentUser(user);

                if (user.perfil === 'PROFESSOR') {
                    window.location.href = '/professor.html';
                } else if (user.perfil === 'ALUNO') {
                    window.location.href = '/aluno.html';
                } else {
                    window.location.href = '/responsavel.html';
                }
            } catch (err) {
                const target = credentials[currentRole]?.url || '/professor.html';
                window.location.href = target;
            }
        }
    </script>
</body>
</html>
